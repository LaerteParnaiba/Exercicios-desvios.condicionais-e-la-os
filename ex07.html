<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 07 js</title>
</head>
<body>




    <script>
        const turno = Number(prompt("diigte um número de 1 a 3 aos correspondentes turnos: Manhã, Tarde ou Noite"));

        switch(turno){
            case 1 : alert("Manhã");
            break;

            case 2 : alert("tarde");
            break;

            case 3 : alert("Noite");
            break;

            default: 
            alert("turno inválido");
        }
    </script>
</body>
</html>
