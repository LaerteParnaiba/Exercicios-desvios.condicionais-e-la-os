<body>
    
    <script>
        const itens =47;
        const caixas = 6;
          const qtd_de_caixas = Math.floor(itens/caixas);
          const itens_sobra = itens%caixas;
          const quantidade_vagas = 4**3;

          const resultado = `
          Quantidade de caixas cheias: ${qtd_de_caixas}
          itens que sobraram: ${itens_sobra}
          vagas disponíveis: ${quantidade_vagas}`;

          alert(resultado);
    </script>
</body>
